# The project's formatter (.oxfmtrc.json), in place of a global prettier.
# Helix looks the command up on PATH and runs it in the file's directory, so
# npx finds the local install.
[[language]]
name = "typescript"
formatter = { command = "npx", args = [
  "--no-install",
  "oxfmt",
  "--stdin-filepath=%{buffer_name}",
] }
auto-format = true

[[language]]
name = "javascript"
formatter = { command = "npx", args = [
  "--no-install",
  "oxfmt",
  "--stdin-filepath=%{buffer_name}",
] }
auto-format = true
